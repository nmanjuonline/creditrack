<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181e2e" />
      <stop offset="60%" stop-color="#0a0d14" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Ambient Gold Halo -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Metallic Brushed Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="26%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="68%" stop-color="#fbbf24" />
      <stop offset="78%" stop-color="#fef08a" />
      <stop offset="88%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Chip Gradient -->
    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Base Obsidian Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Ambient Gold Aura behind card -->
  <rect x="110" y="145" width="292" height="222" rx="28" fill="rgba(245, 158, 11, 0.16)" filter="url(#goldGlow)" />

  <!-- Main Luxury Gold Card -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="152" width="272" height="208" rx="20" fill="url(#goldSheen)" stroke="rgba(254, 240, 138, 0.55)" stroke-width="1.5" />

    <!-- EMV Chip -->
    <g transform="translate(148, 194)">
      <rect width="44" height="34" rx="6" fill="url(#chipGold)" stroke="#b45309" stroke-width="1" />
      <!-- Circuit lines -->
      <line x1="4" y1="17" x2="40" y2="17" stroke="#78350f" stroke-width="1" />
      <line x1="14" y1="4" x2="14" y2="30" stroke="#78350f" stroke-width="1" />
      <line x1="30" y1="4" x2="30" y2="30" stroke="#78350f" stroke-width="1" />
      <rect x="17" y="10" width="10" height="14" rx="3" fill="none" stroke="#78350f" stroke-width="1" />
    </g>

    <!-- Contactless NFC waves -->
    <g transform="translate(210, 211)" fill="none" stroke="#78350f" stroke-linecap="round" stroke-width="2">
      <path d="M 0 -7 A 9 9 0 0 1 0 7" />
      <path d="M 5 -12 A 16 16 0 0 1 5 12" />
      <path d="M 10 -17 A 23 23 0 0 1 10 17" />
    </g>

    <!-- Top-Right Minimalist Luxury Brand Crest -->
    <circle cx="355" cy="186" r="11" fill="none" stroke="#78350f" stroke-width="1.75" />
    <circle cx="347" cy="186" r="11" fill="none" stroke="#78350f" stroke-width="1.75" opacity="0.8" />

    <!-- Embossed Cardholder Dots -->
    <g fill="#78350f" opacity="0.85">
      <circle cx="152" cy="274" r="2.5" />
      <circle cx="160" cy="274" r="2.5" />
      <circle cx="168" cy="274" r="2.5" />
      <circle cx="176" cy="274" r="2.5" />

      <circle cx="206" cy="274" r="2.5" />
      <circle cx="214" cy="274" r="2.5" />
      <circle cx="222" cy="274" r="2.5" />
      <circle cx="230" cy="274" r="2.5" />

      <circle cx="260" cy="274" r="2.5" />
      <circle cx="268" cy="274" r="2.5" />
      <circle cx="276" cy="274" r="2.5" />
      <circle cx="284" cy="274" r="2.5" />

      <circle cx="314" cy="274" r="2.5" />
      <circle cx="322" cy="274" r="2.5" />
      <circle cx="330" cy="274" r="2.5" />
      <circle cx="338" cy="274" r="2.5" />
    </g>

    <!-- Bottom Metadata Lines -->
    <rect x="152" y="312" width="60" height="4" rx="2" fill="#78350f" opacity="0.65" />
    <rect x="330" y="312" width="32" height="4" rx="2" fill="#78350f" opacity="0.65" />
  </g>
</svg>
